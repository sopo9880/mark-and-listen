name: CI
on:
  pull_request:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Publish this build as a test prerelease (vX.Y.Z.W-rc.N, ignored by the in-app updater)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - run: npm ci
      - run: npx prettier --check "src/**/*.mjs" "public/**/*.mjs" "test/**/*.mjs" "scripts/**/*.mjs"
      - run: npm test

  windows:
    # Unsigned build + installed-app smoke test. Releases are signed only by release-beta-win64.yml on main.
    needs: test
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - name: Build and smoke-test the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          # Saved API keys are DPAPI-encrypted through PowerShell; prove the round trip on a real Windows runner.
          node -e "import('./src/secrets.mjs').then(async (m) => { const s = m.createSecretStore(process.env.RUNNER_TEMP + '/keys.json'); await s.save({ gemini: 'AIza-ci-roundtrip-1' }); const k = await s.load(); if (k.gemini !== 'AIza-ci-roundtrip-1') { console.error('DPAPI round trip failed'); process.exit(1); } console.log('DPAPI key storage ok'); })"
          ./scripts/prepare-windows.ps1
          rustup target add x86_64-pc-windows-msvc
          npm run build:windows
          $setup = @(Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' -Filter '*.exe')
          if ($setup.Count -ne 1) { throw 'Expected one setup EXE' }
          $version = (Get-Content package.json | ConvertFrom-Json).displayVersion
          ./scripts/smoke-windows.ps1 -Installer $setup[0].FullName -ExpectedVersion $version
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $setup[0].FullName "dist/Mark-and-Listen-$version-ci-unsigned-Windows-x64-Setup.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-windows-x64-unsigned
          path: dist/
          retention-days: 7

  prerelease:
    # Test builds for manual download. The tag has an -rc suffix, so installed apps never offer it as an update.
    needs: windows
    if: github.event_name == 'workflow_dispatch' && inputs.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ci-windows-x64-unsigned
          path: dist
      - name: Publish test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').displayVersion")"
          tag="v${version}-rc.${GITHUB_RUN_NUMBER}"
          (cd dist && sha256sum *.exe > SHA256SUMS.txt)
          {
            echo "테스트 프리릴리스 · ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
            echo
            echo "- 서명되지 않은 CI 빌드입니다(Windows SmartScreen 경고가 뜰 수 있음). 앱 내 업데이트는 꺼져 있습니다."
            echo "- 이 태그는 설치된 앱의 자동 업데이트 대상이 아닙니다."
            echo
            cat BETA-${version}.md
          } > notes.md
          gh release create "$tag" dist/*.exe dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Mark & Listen ${version} 테스트 (rc.${GITHUB_RUN_NUMBER})" --notes-file notes.md
