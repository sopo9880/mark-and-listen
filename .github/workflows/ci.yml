name: CI
on:
  pull_request:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Publish this build as a test prerelease (vX.Y.Z.W-rc.N, ignored by the in-app updater)
        type: boolean
        default: false
      macos_attach_to:
        description: Build macOS DMGs of this ref and attach them to this existing test prerelease tag (e.g. v0.2.0.0-rc.38); skips the Windows build
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - run: npm ci
      - run: npx prettier --check "src/**/*.mjs" "public/**/*.mjs" "test/**/*.mjs" "scripts/**/*.mjs"
      - run: npm test

  windows:
    # Unsigned build + installed-app smoke test. Releases are signed only by release-beta-win64.yml on main.
    needs: test
    if: github.event_name != 'workflow_dispatch' || inputs.macos_attach_to == ''
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - name: Build and smoke-test the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          # Saved API keys are DPAPI-encrypted through PowerShell; prove the round trip on a real Windows runner.
          node -e "import('./src/secrets.mjs').then(async (m) => { const s = m.createSecretStore(process.env.RUNNER_TEMP + '/keys.json'); await s.save({ gemini: 'AIza-ci-roundtrip-1' }); const k = await s.load(); if (k.gemini !== 'AIza-ci-roundtrip-1') { console.error('DPAPI round trip failed'); process.exit(1); } console.log('DPAPI key storage ok'); })"
          ./scripts/prepare-windows.ps1
          rustup target add x86_64-pc-windows-msvc
          npm run build:windows
          $setup = @(Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' -Filter '*.exe')
          if ($setup.Count -ne 1) { throw 'Expected one setup EXE' }
          $version = (Get-Content package.json | ConvertFrom-Json).displayVersion
          ./scripts/smoke-windows.ps1 -Installer $setup[0].FullName -ExpectedVersion $version
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $setup[0].FullName "dist/Mark-and-Listen-$version-ci-unsigned-Windows-x64-Setup.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-windows-x64-unsigned
          path: dist/
          retention-days: 7

  prerelease:
    # Test builds for manual download. The tag has an -rc suffix, so installed apps never offer it as an update.
    needs: windows
    if: github.event_name == 'workflow_dispatch' && inputs.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ci-windows-x64-unsigned
          path: dist
      - name: Publish test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').displayVersion")"
          tag="v${version}-rc.${GITHUB_RUN_NUMBER}"
          (cd dist && sha256sum *.exe > SHA256SUMS.txt)
          {
            echo "테스트 프리릴리스 · ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
            echo
            echo "- 서명되지 않은 CI 빌드입니다(Windows SmartScreen 경고가 뜰 수 있음). 앱 내 업데이트는 꺼져 있습니다."
            echo "- 이 태그는 설치된 앱의 자동 업데이트 대상이 아닙니다."
            echo
            cat BETA-${version}.md
          } > notes.md
          gh release create "$tag" dist/*.exe dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Mark & Listen ${version} 테스트 (rc.${GITHUB_RUN_NUMBER})" --notes-file notes.md

  macos:
    # Optional: macOS DMGs for an existing test prerelease (Actions › CI › Run workflow › macos_attach_to).
    if: github.event_name == 'workflow_dispatch' && inputs.macos_attach_to != ''
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            label: Apple-Silicon
          - arch: x64
            target: x86_64-apple-darwin
            label: Intel
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - name: Build the DMG (unsigned, ad-hoc code signature)
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          ./scripts/prepare-macos.sh "${{ matrix.arch }}"
          rustup target add "${{ matrix.target }}"
          # macOS icons from the app logo (upscaled for the .icns sizes).
          sips -z 1024 1024 public/logo.png --out "$RUNNER_TEMP/logo-1024.png" >/dev/null
          npx tauri icon "$RUNNER_TEMP/logo-1024.png" -o src-tauri/icons
          cat > "$RUNNER_TEMP/macos.json" <<'JSON'
          {
            "bundle": {
              "targets": ["app", "dmg"],
              "icon": ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.icns"],
              "macOS": { "signingIdentity": "-", "minimumSystemVersion": "11.0" }
            }
          }
          JSON
          npx tauri build --target "${{ matrix.target }}" --bundles app,dmg --config "$RUNNER_TEMP/macos.json"
      - name: Smoke-test the app bundle
        shell: bash
        run: |
          set -euxo pipefail
          ls src-tauri/target/${{ matrix.target }}/release/bundle/*
          app="$(find "src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -name '*.app' | head -n1)"
          res="$app/Contents/Resources"
          test -x "$res/runtime/node"
          test -f "$res/app/src/main.mjs"
          count="$(find "$res/app/assets/directions" -name '*.wav' | wc -l | tr -d ' ')"
          [ "$count" = "39" ] || { echo "Expected 39 direction clips, found $count"; exit 1; }
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            # The runner is Apple Silicon: actually start the bundled backend and ask it for a session.
            (cd "$res" && PORT=0 "$res/runtime/node" app/src/main.mjs > "$RUNNER_TEMP/backend.log" 2>&1 &)
            for i in $(seq 1 120); do grep -q MARK_READY "$RUNNER_TEMP/backend.log" && break; sleep 1; done
            cat "$RUNNER_TEMP/backend.log"
            port="$(sed -n 's/^MARK_READY://p' "$RUNNER_TEMP/backend.log" | head -n1)"
            [ -n "$port" ] || { echo "Backend did not start"; exit 1; }
            curl -fsS "http://127.0.0.1:$port/api/session" | grep -q '"token"'
            pkill -f "app/src/main.mjs" || true
          else
            file "$res/runtime/node" | grep -q x86_64
          fi
          codesign -dv "$app" 2>&1 | grep -q "Signature=adhoc"
          version="$(node -p "require('./package.json').displayVersion")"
          mkdir -p dist
          dmg="$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -name '*.dmg' | head -n1)"
          cp "$dmg" "dist/Mark-and-Listen-${version}-ci-unsigned-macOS-${{ matrix.label }}.dmg"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-macos-${{ matrix.arch }}-unsigned
          path: dist/
          retention-days: 7

  macos-attach:
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ci-macos-*
          merge-multiple: true
          path: dist
      - name: Attach DMGs to the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.macos_attach_to }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9.]+-rc\.[0-9]+$ ]] || { echo "Only test prerelease tags"; exit 1; }
          (cd dist && shasum -a 256 *.dmg > SHA256SUMS-macOS.txt)
          gh release upload "$TAG" dist/*.dmg dist/SHA256SUMS-macOS.txt --clobber --repo "$GITHUB_REPOSITORY"
