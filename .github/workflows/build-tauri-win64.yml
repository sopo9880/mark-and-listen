name: Tauri Windows x64 beta
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mark-listen-tauri-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    if: github.sha == 'a0e44520c42fa767949c899f6cd8a5e52afae479'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - name: Test the beta
        run: |
          npm ci
          npm test
      - name: Build Windows x64 installer
        shell: pwsh
        run: |
          ./scripts/prepare-windows.ps1
          rustup target add x86_64-pc-windows-msvc
          npm run build:windows
      - name: Verify and measure the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = @(Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' -Filter '*.exe')
          if ($setup.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          $name = 'Mark-and-Listen-0.1.0.0-Windows-x64-Setup.exe'
          Copy-Item $setup[0].FullName "dist/windows/$name"
          ./scripts/smoke-windows.ps1 -Installer (Resolve-Path "dist/windows/$name")
          $hash = (Get-FileHash "dist/windows/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD "dist/windows/SHA256SUMS.txt"), "$hash  $name" + [char]10, [Text.Encoding]::ASCII)
          $size = (Get-Item "dist/windows/$name").Length
          $percent = [Math]::Round((1 - $size / 166832725) * 100, 1)
          Add-Content $env:GITHUB_STEP_SUMMARY "0.1.0.0 installer: $size bytes. 0.0.0.2: 166832725 bytes. Size reduction: $percent%."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Mark-and-Listen-0.1.0.0-Windows-x64
          path: dist/windows/
          if-no-files-found: error

  publish-prerelease:
    needs: windows-x64
    if: github.repository == 'sopo9880/mark-and-listen' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Mark-and-Listen-0.1.0.0-Windows-x64
          path: release-files
      - name: Verify uploaded installer and create prerelease
        shell: bash
        working-directory: release-files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v0.1.0.0
          installer=Mark-and-Listen-0.1.0.0-Windows-x64-Setup.exe
          test -s "$installer"
          test "$(wc -l < SHA256SUMS.txt)" -eq 1
          test "$(sha256sum "$installer")" = "$(cat SHA256SUMS.txt)"
          releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')"
          tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags" --jq '.[].name')"
          if grep -Fxq "$tag" <<< "$releases" || grep -Fxq "$tag" <<< "$tags"; then
            echo "::error::The prerelease or tag already exists. No existing release or tag was changed."
            exit 1
          fi
          gh release create "$tag" "$installer" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Mark & Listen 0.1.0.0 Beta" \
            --notes "Unsigned Windows x64 installer. GitHub Actions verified installation, the local backend and the home screen in system WebView2. Physical Windows hardware and live provider API calls were not tested."
